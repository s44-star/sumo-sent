<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumo Sent | Institutional Routing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f8fafc; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(51, 65, 85, 0.5); }
        .glow-button { box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .glow-button:hover { box-shadow: 0 0 25px rgba(16, 185, 129, 0.6); }
    </style>
</head>
<body class="relative min-h-screen flex items-center justify-center p-4 overflow-x-hidden">

    <div class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-blue-900/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-emerald-900/10 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="relative w-full max-w-md z-10">
        
        <div class="flex justify-between items-center mb-6 px-2">
            <h1 class="text-2xl font-extrabold tracking-tight">Sumo<span class="text-gray-400">Sent.</span></h1>
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></div>
                <span class="text-[10px] font-mono text-yellow-500 tracking-widest uppercase">Awaiting Clearance</span>
            </div>
        </div>

        <div id="paywall" class="glass-panel rounded-2xl p-6 shadow-2xl mb-6 border-t-2 border-t-green-500">
            <h2 class="text-xl font-semibold mb-2 text-center">Institutional License</h2>
            <p class="text-sm text-gray-400 mb-6 text-center">Bypass API fees. Direct dark-pool WhatsApp routing. Lifetime access.</p>
            
            <div class="bg-[#030712] rounded-xl p-4 mb-6 border border-gray-800 flex flex-col items-center">
                <span class="text-[10px] font-mono text-gray-500 uppercase tracking-widest mb-3">Scan to Unlock Protocol</span>
                <h3 class="text-3xl font-bold text-white mb-4">₹999</h3>
                
                <div class="bg-white p-2 rounded-lg mb-4 w-48 h-48 flex items-center justify-center">
                    <img src="qr.png" alt="PhonePe QR" class="w-full h-full object-contain">
                </div>
                
                <p class="text-xs text-gray-500 font-mono text-center">Accepted: PhonePe / GPay / Paytm<br>Merchant: Subham Praharaj</p>
            </div>

            <button onclick="verifyPayment()" class="w-full bg-green-500 hover:bg-green-400 text-black font-bold font-mono tracking-wide py-4 rounded-lg transition-all glow-button">
                [ I HAVE PAID: VERIFY NOW ]
            </button>
        </div>

    </div>

    <script>
        function verifyPayment() {
            // REPLACE THIS NUMBER WITH YOUR ACTUAL WHATSAPP NUMBER (include country code 91)
            const adminNumber = "YOUR_PHONE_NUMBER_HERE"; 
            
            const message = encodeURIComponent("SYSTEM ALERT: I have paid ₹999 for the Sumo Sent Institutional License. Here is my payment screenshot for verification.");
            const waLink = `https://wa.me/${adminNumber}?text=${message}`;
            
            // Open WhatsApp
            window.open(waLink, '_blank');
            
            // UI Feedback
            const btn = document.querySelector('button');
            btn.innerHTML = "[ AWAITING MANUAL UNLOCK... ]";
            btn.classList.remove('bg-green-500', 'hover:bg-green-400', 'text-black');
            btn.classList.add('bg-gray-800', 'text-green-500', 'cursor-not-allowed');
        }
    </script>
</body>
</html>
