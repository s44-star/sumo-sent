<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo-Zap | Free WhatsApp Sender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function generateLinks() {
            const message = encodeURIComponent(document.getElementById('message').value);
            const numbers = document.getElementById('numbers').value.split('\n');
            const output = document.getElementById('output');
            output.innerHTML = ''; // Clear previous

            if (!message || numbers.length === 0 || numbers[0] === "") {
                alert("Please enter a message and at least one number.");
                return;
            }

            numbers.forEach(num => {
                const cleanNum = num.replace(/\D/g, ''); // Remove non-numeric characters
                if (cleanNum.length >= 10) {
                    // Ensure it has country code (default to 91 for India if missing)
                    const finalNum = cleanNum.length === 10 ? '91' + cleanNum : cleanNum;
                    const link = `https://wa.me/${finalNum}?text=${message}`;
                    
                    const btn = document.createElement('a');
                    btn.href = link;
                    btn.target = "_blank";
                    btn.className = "block w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg mb-2 text-center transition shadow-md";
                    btn.innerText = `Send to +${finalNum}`;
                    output.appendChild(btn);
                }
            });
            document.getElementById('results-section').classList.remove('hidden');
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border-t-4 border-green-500">
        <h1 class="text-2xl font-extrabold text-slate-800 mb-2">WhatsApp Promo-Zap</h1>
        <p class="text-slate-500 text-sm mb-6">Generate free, clickable blast links for your customers.</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Your Promotional Message</label>
                <textarea id="message" rows="3" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none" placeholder="e.g., Diwali Sale! Get 50% off today..."></textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Customer Phone Numbers</label>
                <p class="text-xs text-slate-400 mb-2">Put one number per line (with or without country code)</p>
                <textarea id="numbers" rows="4" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none" placeholder="9876543210&#10;919876543211"></textarea>
            </div>

            <button onclick="generateLinks()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition">
                ⚡ Generate Blast Links
            </button>
        </div>

        <div id="results-section" class="mt-8 hidden">
            <div class="border-t border-slate-200 pt-6">
                <h2 class="text-sm font-bold text-slate-800 mb-4 uppercase tracking-wider">Your Send Buttons</h2>
                <div id="output" class="max-h-60 overflow-y-auto pr-2">
                    </div>
            </div>
        </div>
        
    </div>

</body>
</html>
